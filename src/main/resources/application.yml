spring:
  application:
    name: digest

  datasource:
    # Local dev only. Production (GitHub Actions -> Neon) overrides these via
    # SPRING_DATASOURCE_* environment variables. Never put Neon creds in this file.
    url: jdbc:postgresql://localhost:5433/digest
    username: digest
    password: digest

  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate only checks its entities match it and
      # refuses to start if they don't. Never 'update' or 'create-drop'.
      ddl-auto: validate
    # Boot defaults this to true and warns about it. Leaving it on holds a DB
    # connection for the whole request and lets lazy loading happen in the view
    # layer — a footgun worth disabling before it can bite.
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
